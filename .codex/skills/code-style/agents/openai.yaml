interface:
  display_name: "C# Architecture Reviewer"
  short_description: "Review project C# KISS, SOLID, ownership, and Unity boundaries."
  default_prompt: "Use $code-style to review or plan project-owned C# under Assets/Scripts. Read references/KISS.md and references/SOLID.md when choosing abstractions, responsibilities, interfaces, inheritance, or dependency direction. Check the current owner chain, Unity lifecycle, serialization, and project conventions before proposing changes."
